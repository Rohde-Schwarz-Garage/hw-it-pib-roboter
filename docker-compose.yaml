services:
  flask-app:
    image: ${PIB_IMAGE_PREFIX:-ghcr.io/pib-rocks/pib-backend}-flask-app:${PIB_IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: ./pib_api/flask/Dockerfile
      args:
        # Release tag from the git checkout, injected into /etc/pib_version.
        # The update runner passes this explicitly before `up --build`:
        #   docker compose build --build-arg APP_VERSION=<tag> flask-app
        # Develop-channel builds pass the marker "develop" (there is no tag).
        # This default applies only when that argument and the environment are
        # both absent.
        APP_VERSION: ${APP_VERSION:-dev}
        PIB_SDK_VERSION: ${PIB_SDK_VERSION:-0.9.0}
    command: "bash -c 'python3 -m db_location && flask --app run db upgrade && flask --app run seed_db && flask --app run reconcile_system_properties && exec gunicorn --workers 1 --threads 8 --bind 0.0.0.0:5000 --timeout 600 run:app'"
    networks:
      - pib-network
    ports:
      - "5000:5000"
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:////data/pibdata.db
      - PIB_BLOCKLY_SERVER_URL=http://pib-blockly-server:2442
      - PYTHON_CODE_DIR=/root/cerebra_programs
      - MARIMO_NOTEBOOKS_DIR=/home/pib/programs/notebooks
      - PIB_HERMES_PROFILES_DIR=/home/pib/.hermes/profiles
      - PIB_HERMES_DAEMON_URL=${PIB_HERMES_DAEMON_URL:-http://hermes-daemon:8088}
      - PIB_HARDWARE_VARIANT=${PIB_HARDWARE_VARIANT:-}
      - PIB_UPDATE_DIR=/app/.update
      - PIB_KEY_STORE_PATH=/home/pib/app/secrets/provider_key_store.json
      - PIB_OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Pictures a tool captured are stored here, not in the source bind mount
      # above: a chat message keeps a reference, the bytes live in this volume.
      - PIB_CHAT_IMAGE_DIR=/app/chat_images
      - HOST_IP_FILE=/etc/pib_host_ip
      - ROBOT_MODEL_DIR=/data/robot-model
      # Empty means read /etc/pib_smart_chats. 0 disables the Hermes channel.
      - PIB_SMART_CHATS=${PIB_SMART_CHATS:-}
      - HOMEASSISTANT_URL=${HOMEASSISTANT_URL:-http://homeassistant:8123}
      - MATTER_SERVER_URL=${MATTER_SERVER_URL:-ws://host.docker.internal:5580/ws}
    volumes:
      - ./pib_api/flask/:/app
      - /home/pib/app/data:/data
      - /home/pib/app/pib-backend/pib_hermes_config/pib_hermes_config:/app/pib_hermes_config
      # Ciphertext for provider keys. Not the flask source tree, and not the
      # Hermes profiles directory (SOUL.md / MEMORY.md live there).
      - /home/pib/app/secrets:/home/pib/app/secrets
      - /home/pib/app/.update:/app/.update
      # A chat image belongs beside its message, not in the flask source tree,
      # which this file mounts as /app. A named volume survives the recreate of
      # the service and the update of the image.
      - chat_images:/app/chat_images
      # The release pairing helper lives in the repository's setup directory, which the flask bind
      # mount above hides: /app *is* pib_api/flask, so nothing inside the container reaches the
      # repository root. Without this mount GET /system/update/available cannot annotate releases.
      - ./setup:/app/setup:ro
      - /etc/pib_hardware_variant:/etc/pib_hardware_variant:ro
      - /etc/pib_smart_chats:/etc/pib_smart_chats:ro
      - /etc/pib_host_ip:/etc/pib_host_ip:ro
      - programs:/root/cerebra_programs
      - /home/pib/programs/notebooks:/home/pib/programs/notebooks
      # A personality's SOUL.md must land on the host, at the same path the
      # ros-voice-assistant service reads it from. Only profiles/ is shared here;
      # the rest of HERMES_HOME holds the agent's credentials, which this
      # externally reachable API has no reason to see.
      - /home/pib/.hermes/profiles:/home/pib/.hermes/profiles
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/serial/by-id:/dev/serial/by-id:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    extra_hosts:
      - host.docker.internal:host-gateway

  rosbridge-ws:
    image: ${PIB_IMAGE_PREFIX:-ghcr.io/pib-rocks/pib-backend}-rosbridge-ws:${PIB_IMAGE_TAG:-develop}
    build:
      context: ./ros_packages
      dockerfile: ./rosbridge/Dockerfile
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml default_call_service_timeout:=90.0
    networks:
      - pib-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "9090:9090"

  ros-camera:
    image: ${PIB_IMAGE_PREFIX:-ghcr.io/pib-rocks/pib-backend}-ros-camera:${PIB_IMAGE_TAG:-develop}
    privileged: true
    build:
      context: ./ros_packages
      dockerfile: ./camera/Dockerfile
    command: ros2 run oak_d_lite stereo
    profiles:
      - all
      - camera
    volumes:
      - /dev/:/dev/
      - ${PIB_MODEL_STORE:-/home/pib/app/pib-models}:/models:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    networks:
      - pib-network
    environment:
      - PIB_CAMERA_STEREO=off
      - DEPTHAI_CRASHDUMP=0
      - FLASK_API_BASE_URL=http://flask-app:5000
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rosbridge-ws
      - flask-app

  ros-motors:
    image: ${PIB_IMAGE_PREFIX:-ghcr.io/pib-rocks/pib-backend}-ros-motors:${PIB_IMAGE_TAG:-develop}
    build:
      context: .
      dockerfile: ./ros_packages/motors/Dockerfile
    command: ros2 launch motors launch.py
    profiles:
      - all
      - motors
    volumes:
      - /dev/:/dev/
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
    networks:
      - pib-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_API_BASE_URL=http://flask-app:5000
      - PIB_BLOCKLY_SERVER_URL=http://pib-blockly-server:2442
      - TINKERFORGE_HOST=host.docker.internal
      - TINKERFORGE_PORT=4223
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rosbridge-ws
      - flask-app

  ros-display:
    image: ${PIB_IMAGE_PREFIX:-ghcr.io/pib-rocks/pib-backend}-ros-display:${PIB_IMAGE_TAG:-develop}
    privileged: true
    build:
      context: .
      dockerfile: ./ros_packages/display/Dockerfile
    profiles:
      - all
      - display
    volumes:
      - ./ros_packages/display/expression_faces:/app/pib-expression-faces:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/user/1000
      - /dev/dri:/dev/dri
      - /home/pib/app/.update:/app/.update
      # A chat image belongs beside its message, not in the flask source tree,
      # which this file mounts as /app. A named volume survives the recreate of
      # the service and the update of the image.
    environment:
      - STATIC_IMAGE_DIR=/app/ros2_ws/display/static_images
      - PIB_EXPRESSION_DIR=/app/pib-expression-faces
      - PIB_DISPLAY_WIDTH=1024
      - PIB_DISPLAY_HEIGHT=600
      - PIB_DISPLAY_ON_DEMAND=1
      - PIB_DISPLAY_TEXT_MAX_CHARS=40
      - PIB_DISPLAY_TEXT_CACHE_MAX=50
      - PIB_DISPLAY_POLL_MS=5
      - PIB_UPDATE_DIR=/app/.update
      - FLASK_API_BASE_URL=http://flask-app:5000
      - PIB_DISPLAY_PASSWORD_PROMPT=0
      - PIB_KEY_STORE_PROMPT_URL=http://127.0.0.1:5000/system/key-store/display
      - XDG_RUNTIME_DIR=/run/user/1000
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - GDK_BACKEND=wayland
      - HOME=/tmp
      - ROS_HOME=/tmp/.ros
    user: "1000:1000"
    command: ros2 launch display launch.py
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pib-network

  control:
    image: control-img:latest
    build:
      dockerfile: src/control/Dockerfile
    profiles:
      - all

volumes:
  programs:
  chat_images:

networks:
  pib-network:
    name: pib-network
    driver: bridge
