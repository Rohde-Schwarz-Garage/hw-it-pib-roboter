[project]
name = "hw-it-pib-roboter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyusb>=1.2",
    "sounddevice>=0.5",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = ["ruff", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ANN", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-statements = 12
